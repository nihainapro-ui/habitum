<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Habitum">
  <!-- Marque du produit : l'anneau ◉, dans le dégradé des boutons principaux.
       Mêmes valeurs que styles/tokens.css (--bg, --acc, --acc2) et que les
       icônes PNG générées par scripts/generate-icons.mjs. -->
  <defs>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d7cff" />
      <stop offset="1" stop-color="#22e0d0" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#04060d" />
  <circle cx="32" cy="32" r="19" fill="none" stroke="url(#h)" stroke-width="6" />
  <circle cx="32" cy="32" r="7" fill="url(#h)" />
</svg>
