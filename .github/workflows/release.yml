name: Release

on:
  push: { tags: ['v*'] }

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - run: gh release create "${{ github.ref_name }}" --generate-notes --verify-tag
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
