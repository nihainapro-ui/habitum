name: Release

on:
  push: { tags: ['v*'] }

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - run: gh release create "${{ github.ref_name }}" --generate-notes --verify-tag
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
