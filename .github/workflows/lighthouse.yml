name: Lighthouse

# Tâche 7.7 — le budget de performance vit en CI, pas dans une bonne intention.
#
# Il tourne sur les PR et à la demande, PAS sur chaque push de `main` : un run
# Lighthouse coûte plusieurs minutes d'Actions, et le budget mensuel du plan
# gratuit est fini. Ce qu'on veut attraper, c'est une régression AVANT la
# fusion — c'est exactement ce que couvre `pull_request`.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: >-
          URL à mesurer. Vide = la construction locale, comportement des PR.
          Renseignée = une PRODUCTION déjà en ligne, ce que demande la
          vérification 10 du plan 8 § 8.9 — et qu'aucun chemin outillé ne
          permettait avant le 27 août 2026.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  budget:
    name: budget de performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # La construction ne sert QUE si l'on mesure la machine locale. Viser une
      # production déjà en ligne tout en construisant l'application pour la
      # laisser inutilisée coûterait plusieurs minutes d'Actions pour rien.
      - if: inputs.base_url == ''
        run: npm run build
      # `autorun` collecte trois passes par URL, applique `lighthouserc.cjs` et
      # échoue si un seuil n'est pas tenu. Le serveur local n'est démarré que
      # lorsque `BASE_URL` est vide — c'est la configuration qui le décide.
      - run: npx --yes @lhci/cli@0.15.x autorun
        env:
          BASE_URL: ${{ inputs.base_url }}
      # Le rapport part en ARTEFACT, pas sur un stockage public tiers : la
      # promesse « aucune donnée ne sort » vaut aussi pour l'outillage.
      - name: Rapports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7
