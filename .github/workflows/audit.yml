name: Vulnérabilités

# `npm audit`, SEUL dans son workflow — 11 novembre 2026.
#
# Ce contrôle interroge le REGISTRE, pas le dépôt : une vulnérabilité haute
# publiée demain le rougit sans qu'une ligne ait changé. C'est voulu. Ce qui ne
# l'était pas, c'est qu'il éteigne le reste : étape de `verify`, il faisait
# sauter `e2e` et `visuel`. Ici il rougit, il alerte, et il ne masque rien.
#
# Trois déclencheurs :
#   - chaque PR et chaque push sur `main` : une dépendance ajoutée se juge là ;
#   - chaque matin : un avis publié pendant que personne ne pousse — du
#     18 septembre au 11 novembre, personne n'a poussé — doit se voir quand même.
#
# Seuil `high`. D11 (25 août 2026) : le durcir à `moderate` se décide, il ne se
# subit pas.

on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: '17 5 * * *' }]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      # Pas de `npm ci` : `npm audit` lit le verrou, il n'a pas besoin de
      # node_modules. Vingt secondes au lieu de deux minutes, chaque matin.
      - run: npm audit --audit-level=high
      # Hors PR seulement : sur une PR, le contrôle rouge EST le signal, et le
      # jeton d'une PR venue d'un fork ne peut de toute façon pas écrire.
      - if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'prio:critique',
            });
            // Une issue par incident, pas une par matin.
            if (data.some((i) => i.title.startsWith('Vulnérabilité haute'))) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: 'Vulnérabilité haute dans les dépendances',
              labels: ['type:securite', 'prio:critique'],
              body: [
                '`npm audit --audit-level=high` a échoué sur `main`.',
                '',
                `Exécution : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Premier geste : `npm audit fix` (sans `--force`), puis `npm run verify`.',
                'Si le correctif est une montée majeure, voir `_commentaire_overrides` dans package.json.',
              ].join('\n'),
            });
