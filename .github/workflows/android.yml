name: Android

# APK AUTONOME — l'application entière dans le fichier, sans serveur ni domaine.
#
# POURQUOI EN CI ET PAS EN LOCAL : construire un APK demande un JDK, le SDK
# Android et Gradle — plusieurs gigaoctets d'outillage que personne n'a besoin
# d'installer pour travailler sur l'application web. `ubuntu-latest` les fournit
# déjà. C'est aussi ce qui rend l'artefact reproductible : une seule machine le
# construit, toujours la même.
#
# DEUX CHEMINS, et le second n'existe que si tu as posé les secrets :
#   - toujours : un APK de DÉBOGAGE, publié en artefact du run. Il s'installe
#     par chargement direct et sert à essayer. Sa clé est celle, publique, du
#     débogage Android : il ne peut PAS servir de version distribuée ;
#   - sur étiquette `v*` et si `ANDROID_KEYSTORE_BASE64` existe : un APK de
#     PUBLICATION signé, attaché à la version GitHub.
#
# Sans les secrets, l'étiquette produit quand même l'artefact de débogage, et le
# travail de signature est SAUTÉ — pas en échec. Un workflow rouge pour une
# option non configurée est un workflow qu'on finit par ignorer.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# D24 — droits minimaux. `write` est nécessaire pour ATTACHER l'APK à une
# version GitHub, et seulement pour cela : sur `main` et sur les PR, aucune
# étape n'écrit quoi que ce soit.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK autonome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Le JDK que Gradle et le plugin Android attendent. 21 est la version
      # supportée par le plugin Android Gradle livré avec Capacitor 8.
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: npm ci

      # Export statique + tri des fichiers + copie dans le projet natif.
      # `HABITUM_EMPAQUETE=1` bascule `next.config.mjs` sur `output: 'export'` ;
      # la construction web par défaut n'est pas touchée.
      - name: Construire l’application empaquetée
        run: npm run paquet:sync

      # Les icônes viennent des sources du produit, jamais de celles de
      # Capacitor. Le contrôle échoue si un fichier manque : un APK au logo de
      # l'outil de construction n'est pas livrable.
      - name: Vérifier les icônes de lancement
        run: node scripts/icones-android.mjs --check

      - name: Construire l’APK de débogage
        working-directory: packaging/android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: habitum-debug-apk
          path: packaging/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # Publication signée — uniquement sur étiquette, uniquement si la clé est
      # posée. `env` plutôt que `secrets` dans la condition : `secrets` n'est pas
      # lisible dans un `if` de job, seulement dans une étape.
      # ---------------------------------------------------------------------
      - name: La clé de signature est-elle disponible ?
        id: cle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MAGASIN: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "presente=${{ env.MAGASIN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Reconstituer le magasin de clés
        if: steps.cle.outputs.presente == 'true'
        env:
          MAGASIN: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        # Le fichier est écrit HORS de l'arbre de travail pour qu'aucune étape
        # suivante — ni un artefact distrait — ne puisse l'emporter.
        run: |
          echo "$MAGASIN" | base64 -d > "$RUNNER_TEMP/habitum.keystore"

      - name: Construire l’APK de publication, signé
        if: steps.cle.outputs.presente == 'true'
        working-directory: packaging/android
        env:
          HABITUM_KEYSTORE: ${{ runner.temp }}/habitum.keystore
          HABITUM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HABITUM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HABITUM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Attacher l’APK à la version
        if: steps.cle.outputs.presente == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            packaging/android/app/build/outputs/apk/release/app-release.apk \
            --clobber

      - name: Dire ce qui manque, plutôt que de se taire
        if: startsWith(github.ref, 'refs/tags/v') && steps.cle.outputs.presente != 'true'
        run: |
          echo "::notice::APK signé NON produit — le secret ANDROID_KEYSTORE_BASE64 n'est pas posé."
          echo "::notice::L'APK de débogage reste disponible en artefact de ce run."
