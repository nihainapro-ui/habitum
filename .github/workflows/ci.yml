name: CI

on:
  push: { branches: [main] }
  pull_request:

# D24 — droits minimaux. Par défaut, GITHUB_TOKEN en a bien plus que nécessaire,
# et un workflow est du code exécuté avec ce jeton.
permissions:
  contents: read

# D24 — un nouveau push sur une PR annule le run précédent. Sur dépôt privé,
# les minutes d'Actions sont comptées (2 000/mois) : ne pas les brûler pour
# des runs que personne ne lira.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 = plancher déclaré dans engines ; 22 = ce que Vercel construit.
        node: [20, 22]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Les sept contrôles : typecheck, lint, format, libellés, jetons, tests, build.
      - run: npm run verify
      - name: Vulnérabilités
        # D11 — quatre vulnérabilités connues (postcss, sharp via next, next-intl),
        # dont trois hautes. Leurs correctifs sont des montées MAJEURES (next@16,
        # next-intl@4), planifiées en phase « Qualité » quand l'e2e couvrira huit
        # parcours et pourra détecter une régression.
        # Le seuil remonte à `high` dès que l'issue D11 est fermée.
        run: npm audit --audit-level=critical

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Cache des navigateurs Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # On teste ce qui sera déployé, pas le serveur de développement.
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7
