name: CI

on:
  push: { branches: [main] }
  pull_request:

# D24 — droits minimaux. Par défaut, GITHUB_TOKEN en a bien plus que nécessaire,
# et un workflow est du code exécuté avec ce jeton.
permissions:
  contents: read

# D24 — un nouveau push sur une PR annule le run précédent. Sur dépôt privé,
# les minutes d'Actions sont comptées (2 000/mois) : ne pas les brûler pour
# des runs que personne ne lira.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 = plancher déclaré dans engines ; 22 = ce que Vercel construit.
        node: [20, 22]
    steps:
      # `fetch-depth: 2` — et pas le clone superficiel par défaut.
      #
      # `tests/unit/hooks.test.ts` éprouve le garde-fou `pre-push` en lui
      # soumettant un push NON FAST-FORWARD : il lui faut donc deux commits,
      # `HEAD` et `HEAD~1`. Avec la profondeur 1 d'`actions/checkout`, le dépôt
      # de CI n'en contient qu'un et `git rev-parse HEAD~1` échoue.
      #
      # Le défaut était LATENT depuis le 11 août 2026 : ce test est arrivé avec
      # la révision de la phase 0, et le dernier push antérieur datait du
      # 7 août. Toute la CI échouait depuis, sans que personne ne pousse pour
      # s'en apercevoir — c'est exactement ce que l'alerte `main` rouge est là
      # pour rendre impossible à manquer.
      #
      # Deux commits suffisent : on ne rapatrie pas l'historique entier pour un
      # contrôle qui n'en regarde qu'un de plus.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Les sept contrôles : typecheck, lint, format, libellés, jetons, tests, build.
      - run: npm run verify
      - name: Vulnérabilités
        # D11 — quatre vulnérabilités connues (postcss, sharp via next, next-intl),
        # dont trois hautes. Leurs correctifs sont des montées MAJEURES (next@16,
        # next-intl@4), planifiées en phase « Qualité » quand l'e2e couvrira huit
        # parcours et pourra détecter une régression.
        # Le seuil remonte à `high` dès que l'issue D11 est fermée.
        run: npm audit --audit-level=critical

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` : gitleaks analyse l'HISTORIQUE, pas seulement l'état
      # courant. Un secret retiré au commit suivant reste compromis — c'est
      # tout l'intérêt du contrôle.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Sur un dépôt privé en plan gratuit, GitHub ne peut pas EMPÊCHER une fusion
  # rouge : les contrôles obligatoires n'existent pas. Ce qu'on peut faire, en
  # revanche, c'est rendre l'échec impossible à ne pas voir. Un `main` rouge
  # ouvre une issue critique — même mécanisme que la sonde de production, même
  # raison : sans blocage, il reste le signal, et un signal qu'on peut manquer
  # n'en est pas un.
  alerte-main-rouge:
    needs: [verify, e2e, visuel]
    if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'prio:critique',
            });
            // Une issue par incident, pas une par exécution.
            if (data.some((i) => i.title.startsWith('main est rouge'))) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `main est rouge — ${context.sha.slice(0, 7)}`,
              labels: ['type:defaut', 'prio:critique'],
              body: [
                `La chaîne de vérification a échoué sur \`main\`.`,
                '',
                `Exécution : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                "Le dépôt étant privé sur un plan gratuit, GitHub ne peut pas bloquer une",
                "fusion rouge. Le garde-fou est en amont (`.githooks/pre-push`) et ici, en aval.",
              ].join('\n'),
            });

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Cache des navigateurs Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # On teste ce qui sera déployé, pas le serveur de développement.
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7

  # Non-régression visuelle — tâche 8.2. Onze vues × trois thèmes, comparées au
  # socle versionné dans tests/e2e/visual/socle/.
  #
  # SUR UBUNTU, ET NULLE PART AILLEURS. Le socle porte le suffixe `-linux` :
  # le rendu des polices diffère d'un système à l'autre, et comparer des
  # captures prises sur deux plateformes produit des écarts qui ne veulent rien
  # dire. En local, `npm run test:visual` passe par le conteneur officiel pour
  # obtenir exactement les mêmes pixels que ce job.
  #
  # Job SÉPARÉ de `e2e` : un écart visuel et un parcours cassé ne se lisent pas
  # de la même façon, et le second ne doit pas être noyé par le premier.
  visuel:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Cache des navigateurs Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --project=visual
      # L'écart se REGARDE. Un rapport qui dit « 3 % de pixels différents » sans
      # montrer lesquels ne permet pas de trancher entre une régression et un
      # changement voulu — et c'est exactement la décision que ce job demande.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ecarts-visuels
          path: |
            playwright-report/
            test-results/
          retention-days: 7
